# =============================================================================
# Unwoldam Tarot LLM API - Docker Compose (Development)
# Phase 12: 프로덕션 배포
# =============================================================================

version: '3.8'

services:
  # ============================================================================
  # Tarot API Service (Development)
  # ============================================================================
  tarot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unwoldam-tarot-api-dev
    ports:
      - "8000:8000"
    environment:
      # API Settings
      - API_V1_STR=/api/v1
      - PROJECT_NAME=Unwoldam Tarot API (Dev)
      - VERSION=1.1.0

      # CORS
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000

      # LLM API Keys (환경변수에서 주입)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

      # Redis 설정
      - REDIS_URL=redis://redis:6379/0

      # Server Settings
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
      - DEBUG=true

      # Logging
      - LOG_LEVEL=DEBUG
    volumes:
      # 개발 모드: 코드 변경 실시간 반영
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - tarot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Development mode: 코드 변경 시 자동 재시작
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================================
  # Redis Service (세션 관리)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: unwoldam-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data-dev:/data
    restart: unless-stopped
    networks:
      - tarot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data-dev:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  tarot-network:
    driver: bridge
