# =============================================================================
# Unwoldam Tarot LLM API - Docker Compose (Production)
# Phase 12: 프로덕션 배포
# =============================================================================

version: '3.8'

services:
  # ============================================================================
  # Tarot API Service (Production)
  # ============================================================================
  tarot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unwoldam-tarot-api-prod
    ports:
      - "8000:8000"
    environment:
      # API Settings
      - API_V1_STR=/api/v1
      - PROJECT_NAME=Unwoldam Tarot API
      - VERSION=1.1.0

      # CORS - Production URLs (환경에 맞게 수정 필요)
      - ALLOWED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com

      # LLM API Keys (환경변수에서 주입)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

      # Redis 설정
      - REDIS_URL=redis://redis:6379/0
      - REDIS_KEY_EXPIRY_DAYS=90

      # Server Settings
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DEBUG=false

      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/tarot_api.log

      # Performance
      - WORKERS=4
      - TIMEOUT=120
    volumes:
      # 데이터 및 로그 볼륨 (프로덕션에서는 read-only 권장)
      - ./data:/app/data:ro
      - tarot-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tarot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # Redis Service (세션 관리)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: unwoldam-redis-prod
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - tarot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  tarot-logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  tarot-network:
    driver: bridge
